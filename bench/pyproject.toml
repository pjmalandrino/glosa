[project]
name = "gbench"
version = "0.0.1.dev0"
description = "MMLU-light for document readers — docling-agent, PageIndex and glosa on the same document"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

# Deliberately its own project, with its own lockfile. `docs/EVAL.md` §4.1:
# measuring a competitor must not pull `mellea` or `torch` into glosa's own
# dependency graph. Competitor backends live behind extras and are imported
# inside their adapter's constructor, so `gbench run --engines glosa` needs
# nothing but glosa.
dependencies = [
  "glosa",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
docling-agent = ["docling-agent", "docling-core>=2.0.0,<3.0.0"]
pageindex = ["litellm>=1.0,<2.0"]

[project.scripts]
gbench = "gbench.cli:main"

[tool.uv.sources]
glosa = { path = "..", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<2.0.0",
  "ruff>=0.11.0,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/gbench"]

# Competitor packages are optional by design (`docs/EVAL.md` §4.1), so their
# adapters must type-check on a machine where they are not installed. `yaml`
# ships no stubs and is not worth a `types-` dependency in a bench.
[[tool.mypy.overrides]]
module = ["yaml", "docling_agent.*", "docling_core.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
