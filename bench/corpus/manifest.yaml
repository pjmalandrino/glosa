# The corpus's provenance. This file *is* the corpus: the PDFs and their
# conversions are not committed (`infra/corpus.py` says why), and can be
# rebuilt from here — `gbench fetch` verifies every byte against `sha256`.
#
# Target (B1): 40 papers, 8 themes x 5 — see THEMES.md for which themes and
# why. All posted after the model under test was trained, or the closed-book
# control is measuring how famous the paper is.
#
# The hand-picked path (see THEMES.md, ~30 minutes):
#
#   uv run gbench manifest --from-list corpus/papers.txt
#   uv run gbench fetch      # pins sha256, fills the licence where it can
#   uv run gbench convert    # writes docling.json, doc.md, refs.json
#   uv run gbench lint --verify-quotes
#
# Or harvest, when nobody has an opinion about which papers yet:
#
#   uv run gbench manifest --sets cs,math,q-bio,physics:cond-mat \
#                          --since 2026-03-01 --until 2026-05-31 --per-set 5

# What the corpus commits, which decides which licences it can contain.
#
#   fetch-only        refs, character counts and hashes — not the paper's text.
#                     Any licence works. Reproducible from the pinned SHA-256,
#                     but quotes are only checkable after `gbench fetch`.
#   redistributable   the projected text too, so every quote is checkable from
#                     a clone forever. CC-BY / CC-BY-SA / CC0 only, which rules
#                     out most of arXiv.
#
# fetch-only by default because the alternative costs hours of licence-checking
# before a single question gets written, and that cost falls on the part of the
# work that actually matters.
licence_policy: fetch-only

documents:
  # Not a paper: the generated fixture that lets the harness run in CI with no
  # network and no GPU. `generated: true` exempts it from fetch.
  - slug: toy-ccap
    title: Marché public de travaux — CCAP (fixture)
    generated: true
    license: https://creativecommons.org/publicdomain/zero/1.0/
    primary_category: fixture
