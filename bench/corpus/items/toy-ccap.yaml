  question: "Quel est le montant minimal de l'assurance décennale exigée du titulaire ?"
  options:
    A: "5 % du montant du marché"
    B: "180 jours calendaires"
    C: "20 % du montant du marché"
    D: "1/1000 du montant du marché par jour calendaire de retard"
  answer: E
  removed_from: "#/texts/12"
  distractor_refs:
    A: "#/texts/10"
    B: "#/texts/6"
    C: "#/texts/14"
    D: "#/texts/8"
