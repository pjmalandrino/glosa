# Run defaults. The *documents* live in manifest.yaml — this file only says how
# to run over them.
#
# On 40 papers x 5 questions the plan is deliberately not "four rotations of
# everything": 200 items x 4 x 5 engines is 4 000 executions. Each item gets a
# deterministic assigned rotation instead (the suite is position-balanced as a
# whole), and `flip_sample` items are swept in full to measure per-item
# stability. 320 executions per engine instead of 800.

defaults:
  concurrency: 4
  flip_sample: 40
  model: granite3.3:8b
  provider: ollama

profiles:
  full:
    flip_sample: 40
  smoke:
    items: 12
    flip_sample: 0

# Only read when the `pageindex` engine is selected.
pageindex:
  script: vendor/PageIndex/run_pageindex.py
  cache: runs/pageindex
